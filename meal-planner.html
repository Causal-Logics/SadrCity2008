<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weekly Meal Planner & Grocery List</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green: #2d7a4f;
      --green-light: #e8f5ee;
      --green-mid: #4caf7d;
      --orange: #e07b39;
      --orange-light: #fdf0e8;
      --blue: #3b6ea5;
      --blue-light: #eaf0fb;
      --gray-50: #f9fafb;
      --gray-100: #f3f4f6;
      --gray-200: #e5e7eb;
      --gray-300: #d1d5db;
      --gray-500: #6b7280;
      --gray-700: #374151;
      --gray-900: #111827;
      --radius: 10px;
      --shadow: 0 2px 8px rgba(0,0,0,0.10);
      --shadow-lg: 0 4px 20px rgba(0,0,0,0.13);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--gray-50);
      color: var(--gray-900);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--green) 0%, #1a5c38 100%);
      color: #fff;
      padding: 22px 24px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      box-shadow: var(--shadow-lg);
    }
    header h1 { font-size: 1.55rem; font-weight: 700; letter-spacing: -0.3px; }
    header p { font-size: 0.85rem; opacity: 0.85; margin-top: 2px; }
    .header-btns { display: flex; gap: 10px; flex-wrap: wrap; }
    .btn {
      cursor: pointer; border: none; border-radius: 7px;
      padding: 9px 18px; font-size: 0.88rem; font-weight: 600;
      transition: filter 0.15s, transform 0.1s;
    }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .btn:active { transform: translateY(0); filter: brightness(0.97); }
    .btn-primary   { background: #fff; color: var(--green); }
    .btn-secondary { background: rgba(255,255,255,0.18); color: #fff; border: 1.5px solid rgba(255,255,255,0.45); }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-danger { background: #e03e3e; color: #fff; }
    .btn-sm { padding: 5px 11px; font-size: 0.78rem; }

    /* ── Layout ── */
    main { max-width: 1340px; margin: 0 auto; padding: 28px 18px 60px; }

    /* ── Servings banner ── */
    .servings-bar {
      background: #fff;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      padding: 13px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 24px;
      flex-wrap: wrap;
      box-shadow: var(--shadow);
    }
    .servings-bar label { font-size: 0.88rem; font-weight: 600; color: var(--gray-700); }
    .servings-bar input[type=range] { width: 150px; accent-color: var(--green); }
    .servings-bar .val { font-weight: 700; color: var(--green); min-width: 28px; }

    /* ── Two-column layout ── */
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: 24px; align-items: start; }
    @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

    /* ── Planner card ── */
    .card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1.5px solid var(--gray-200);
      overflow: hidden;
    }
    .card-header {
      padding: 16px 20px;
      border-bottom: 1.5px solid var(--gray-200);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .card-header h2 { font-size: 1.05rem; font-weight: 700; }
    .card-body { padding: 20px; }

    /* ── Day grid ── */
    .days-grid { display: flex; flex-direction: column; gap: 16px; }
    .day-row {
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .day-label {
      background: var(--gray-100);
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border-bottom: 1.5px solid var(--gray-200);
    }
    .meals-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      divide-x: 1px solid var(--gray-200);
    }
    @media (max-width: 600px) { .meals-row { grid-template-columns: 1fr; } }
    .meal-slot {
      padding: 12px 14px;
      border-right: 1px solid var(--gray-200);
      cursor: pointer;
      min-height: 80px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: background 0.15s;
      position: relative;
    }
    .meal-slot:last-child { border-right: none; }
    .meal-slot:hover { background: var(--gray-50); }
    .meal-slot.empty { align-items: center; justify-content: center; }
    .meal-slot .type-badge {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; padding: 2px 7px; border-radius: 20px; align-self: flex-start;
    }
    .type-breakfast { background: #fff3cd; color: #856404; }
    .type-lunch     { background: var(--blue-light); color: var(--blue); }
    .type-dinner    { background: var(--green-light); color: var(--green); }
    .meal-slot .meal-name { font-size: 0.88rem; font-weight: 600; line-height: 1.3; }
    .meal-slot .meal-time { font-size: 0.72rem; color: var(--gray-500); }
    .meal-slot .plus-icon {
      font-size: 1.6rem; color: var(--gray-300); line-height: 1;
      transition: color 0.15s;
    }
    .meal-slot:hover .plus-icon { color: var(--green-mid); }
    .meal-slot .remove-btn {
      position: absolute; top: 6px; right: 6px;
      background: none; border: none; cursor: pointer;
      color: var(--gray-300); font-size: 0.9rem; line-height: 1;
      transition: color 0.15s;
      display: none;
    }
    .meal-slot:hover .remove-btn { display: block; }
    .meal-slot .remove-btn:hover { color: #e03e3e; }

    /* ── Grocery list ── */
    .grocery-card { position: sticky; top: 20px; }
    .grocery-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    .grocery-count {
      background: var(--green); color: #fff;
      font-size: 0.72rem; font-weight: 700;
      padding: 2px 9px; border-radius: 20px; min-width: 28px; text-align: center;
    }
    .grocery-body { padding: 0; max-height: calc(100vh - 200px); overflow-y: auto; }
    .grocery-section { border-bottom: 1px solid var(--gray-100); }
    .grocery-section:last-child { border-bottom: none; }
    .grocery-section-header {
      padding: 10px 18px 8px;
      font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.6px; color: var(--gray-500);
      background: var(--gray-50);
      border-bottom: 1px solid var(--gray-100);
    }
    .grocery-item {
      display: flex; align-items: center; gap: 10px;
      padding: 9px 18px;
      border-bottom: 1px solid var(--gray-100);
      transition: background 0.12s;
    }
    .grocery-item:last-child { border-bottom: none; }
    .grocery-item:hover { background: var(--gray-50); }
    .grocery-item input[type=checkbox] { accent-color: var(--green); width: 15px; height: 15px; flex-shrink: 0; cursor: pointer; }
    .grocery-item label { font-size: 0.85rem; cursor: pointer; flex: 1; line-height: 1.3; }
    .grocery-item.checked label { text-decoration: line-through; color: var(--gray-300); }
    .grocery-amount { font-size: 0.78rem; color: var(--gray-500); white-space: nowrap; }
    .grocery-empty {
      padding: 30px 20px; text-align: center;
      color: var(--gray-500); font-size: 0.88rem;
    }
    .grocery-empty .icon { font-size: 2.2rem; display: block; margin-bottom: 8px; }

    /* ── Recipe Picker Modal ── */
    .modal-overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.5); z-index: 1000;
      align-items: center; justify-content: center;
      padding: 16px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; border-radius: 14px;
      width: 100%; max-width: 700px;
      max-height: 90vh; display: flex; flex-direction: column;
      box-shadow: 0 8px 40px rgba(0,0,0,0.22);
      animation: slideUp 0.2s ease;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-header {
      padding: 18px 22px 14px;
      border-bottom: 1.5px solid var(--gray-200);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-header h3 { font-size: 1.05rem; font-weight: 700; }
    .modal-close { background: none; border: none; cursor: pointer; font-size: 1.3rem; color: var(--gray-500); line-height: 1; }
    .modal-close:hover { color: var(--gray-900); }
    .modal-search {
      padding: 14px 22px 10px;
      border-bottom: 1px solid var(--gray-100);
    }
    .modal-search input {
      width: 100%; padding: 9px 14px; border: 1.5px solid var(--gray-200);
      border-radius: 8px; font-size: 0.9rem; outline: none;
      transition: border-color 0.15s;
    }
    .modal-search input:focus { border-color: var(--green); }
    .modal-filters { display: flex; gap: 8px; padding: 8px 22px 12px; flex-wrap: wrap; }
    .filter-chip {
      cursor: pointer; border: 1.5px solid var(--gray-200); background: #fff;
      border-radius: 20px; padding: 4px 13px; font-size: 0.78rem; font-weight: 600;
      color: var(--gray-700); transition: all 0.12s;
    }
    .filter-chip:hover, .filter-chip.active { background: var(--green); border-color: var(--green); color: #fff; }
    .modal-recipes { overflow-y: auto; flex: 1; padding: 10px 14px 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
    .recipe-card {
      border: 1.5px solid var(--gray-200); border-radius: 9px; padding: 13px;
      cursor: pointer; transition: all 0.15s; display: flex; flex-direction: column; gap: 6px;
    }
    .recipe-card:hover { border-color: var(--green); background: var(--green-light); }
    .recipe-card .rc-name { font-size: 0.88rem; font-weight: 700; line-height: 1.3; }
    .recipe-card .rc-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .recipe-card .rc-time { font-size: 0.73rem; color: var(--gray-500); }
    .recipe-card .rc-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .rc-tag {
      font-size: 0.65rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px;
      padding: 2px 6px; border-radius: 4px;
    }
    .tag-veg  { background: #d1fae5; color: #065f46; }
    .tag-vegan { background: #a7f3d0; color: #064e3b; }
    .tag-gf   { background: #dbeafe; color: #1e40af; }
    .tag-df   { background: #fef3c7; color: #92400e; }
    .tag-qk   { background: #fce7f3; color: #9d174d; }

    /* ── Print styles ── */
    @media print {
      header, .servings-bar, .header-btns, .card-header .header-btns,
      .meal-slot .remove-btn, .modal-overlay { display: none !important; }
      .layout { grid-template-columns: 1fr 280px; }
      .grocery-body { max-height: none; overflow: visible; }
      .grocery-card { position: static; }
    }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--gray-900); color: #fff; padding: 10px 20px;
      border-radius: 8px; font-size: 0.85rem; font-weight: 500;
      opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 2000;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>

<header>
  <div>
    <h1>🥗 Weekly Meal Planner</h1>
    <p>Plan your meals, generate a grocery list instantly</p>
  </div>
  <div class="header-btns">
    <button class="btn btn-secondary" onclick="suggestWeek()">✨ Suggest Week</button>
    <button class="btn btn-secondary" onclick="clearAll()">🗑 Clear All</button>
    <button class="btn btn-primary" onclick="window.print()">🖨 Print</button>
  </div>
</header>

<main>
  <div class="servings-bar">
    <label for="servings">Servings per meal:</label>
    <input type="range" id="servings" min="1" max="8" value="4" oninput="updateServings(this.value)" />
    <span class="val" id="servings-val">4</span>
    <span style="font-size:0.82rem; color:var(--gray-500);">— grocery quantities adjust automatically</span>
  </div>

  <div class="layout">
    <!-- Meal planner -->
    <div class="card">
      <div class="card-header">
        <h2>📅 This Week's Meals</h2>
        <div style="display:flex;gap:8px;">
          <button class="btn btn-sm btn-secondary" onclick="suggestWeek()" style="background:var(--green);color:#fff;border:none;">✨ Suggest Week</button>
        </div>
      </div>
      <div class="card-body">
        <div class="days-grid" id="days-grid"></div>
      </div>
    </div>

    <!-- Grocery list -->
    <div class="card grocery-card">
      <div class="card-header">
        <div class="grocery-header">
          <h2>🛒 Grocery List</h2>
          <span class="grocery-count" id="grocery-count">0</span>
        </div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm" style="background:var(--gray-100);color:var(--gray-700);border:1px solid var(--gray-200);" onclick="uncheckAll()">Uncheck all</button>
          <button class="btn btn-sm btn-orange" onclick="removeChecked()">Remove checked</button>
        </div>
      </div>
      <div class="grocery-body" id="grocery-body"></div>
    </div>
  </div>
</main>

<!-- Recipe picker modal -->
<div class="modal-overlay" id="modal" onclick="closeModalOutside(event)">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modal-title">Choose a Recipe</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-search">
      <input type="text" id="recipe-search" placeholder="Search recipes…" oninput="renderModalRecipes()" />
    </div>
    <div class="modal-filters" id="modal-filters"></div>
    <div class="modal-recipes" id="modal-recipes"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

const CATEGORY_ORDER = [
  'Produce','Meat & Seafood','Dairy & Eggs','Bread & Bakery',
  'Pasta & Rice','Grains & Cereals','Canned Goods','Frozen',
  'Condiments','Oils & Vinegars','Spices','Baking','Health Foods',
  'Deli','Beverages',
];

const TAG_META = {
  veg:   { label: 'Vegetarian', cls: 'tag-veg' },
  vegan: { label: 'Vegan',      cls: 'tag-vegan' },
  gf:    { label: 'GF',         cls: 'tag-gf' },
  df:    { label: 'Dairy-Free', cls: 'tag-df' },
  qk:    { label: 'Quick',      cls: 'tag-qk' },
};

// ── State ─────────────────────────────────────────────────────────────────────
// plan[day][type] = recipe id or null
let plan = {};
let servings = 4;
let groceryChecked = {}; // key → checked boolean
let modalContext = null; // { day, type }
let activeFilter = 'all';

DAYS.forEach(d => {
  plan[d] = {};
  MEAL_TYPES.forEach(t => plan[d][t] = null);
});

// ── Initialization ─────────────────────────────────────────────────────────────
function init() {
  renderDaysGrid();
  renderGroceryList();
  renderModalFilters();
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
}

// ── Days Grid ──────────────────────────────────────────────────────────────────
function renderDaysGrid() {
  const grid = document.getElementById('days-grid');
  grid.innerHTML = DAYS.map(day => `
    <div class="day-row">
      <div class="day-label">${day}</div>
      <div class="meals-row">
        ${MEAL_TYPES.map(type => renderMealSlot(day, type)).join('')}
      </div>
    </div>
  `).join('');
}

function renderMealSlot(day, type) {
  const rid = plan[day][type];
  const recipe = rid ? RECIPES.find(r => r.id === rid) : null;
  if (!recipe) {
    return `
      <div class="meal-slot empty" onclick="openModal('${day}','${type}')">
        <div class="type-badge type-${type}">${type}</div>
        <div class="plus-icon">+</div>
      </div>`;
  }
  const tags = recipe.tags.map(t => `<span class="rc-tag ${TAG_META[t].cls}">${TAG_META[t].label}</span>`).join('');
  return `
    <div class="meal-slot" onclick="openModal('${day}','${type}')">
      <div class="type-badge type-${type}">${type}</div>
      <div class="meal-name">${recipe.name}</div>
      <div class="rc-meta" style="display:flex;gap:6px;flex-wrap:wrap;margin-top:2px;">
        <span class="meal-time">⏱ ${recipe.time} min</span>
        ${tags}
      </div>
      <button class="remove-btn" onclick="removeSlot(event,'${day}','${type}')">✕</button>
    </div>`;
}

function removeSlot(e, day, type) {
  e.stopPropagation();
  plan[day][type] = null;
  renderDaysGrid();
  rebuildGroceryList();
}

// ── Modal ──────────────────────────────────────────────────────────────────────
function openModal(day, type) {
  modalContext = { day, type };
  activeFilter = type; // default filter to the current meal type
  document.getElementById('modal-title').textContent =
    `Choose ${type.charAt(0).toUpperCase()+type.slice(1)} for ${day}`;
  document.getElementById('recipe-search').value = '';
  document.getElementById('modal').classList.add('open');
  renderModalFilters();
  renderModalRecipes();
  document.getElementById('recipe-search').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  modalContext = null;
}

function closeModalOutside(e) {
  if (e.target.id === 'modal') closeModal();
}

function renderModalFilters() {
  const filters = [
    { id: 'all',       label: 'All' },
    { id: 'breakfast', label: '☀️ Breakfast' },
    { id: 'lunch',     label: '🥗 Lunch' },
    { id: 'dinner',    label: '🍽 Dinner' },
    { id: 'veg',       label: '🌿 Veg' },
    { id: 'vegan',     label: '🌱 Vegan' },
    { id: 'gf',        label: 'Gluten-Free' },
    { id: 'df',        label: 'Dairy-Free' },
    { id: 'qk',        label: '⚡ Quick' },
  ];
  document.getElementById('modal-filters').innerHTML = filters.map(f =>
    `<button class="filter-chip ${activeFilter===f.id?'active':''}" onclick="setFilter('${f.id}')">${f.label}</button>`
  ).join('');
}

function setFilter(id) {
  activeFilter = id;
  renderModalFilters();
  renderModalRecipes();
}

function renderModalRecipes() {
  const q = document.getElementById('recipe-search').value.toLowerCase().trim();
  let visible = RECIPES.filter(r => {
    const matchSearch = !q || r.name.toLowerCase().includes(q);
    let matchFilter = true;
    if (activeFilter !== 'all') {
      if (['breakfast','lunch','dinner'].includes(activeFilter)) matchFilter = r.type === activeFilter;
      else matchFilter = r.tags.includes(activeFilter);
    }
    return matchSearch && matchFilter;
  });

  const ctx = modalContext;
  document.getElementById('modal-recipes').innerHTML = visible.length ? visible.map(r => {
    const tags = r.tags.map(t => `<span class="rc-tag ${TAG_META[t].cls}">${TAG_META[t].label}</span>`).join('');
    const selected = ctx && plan[ctx.day][ctx.type] === r.id;
    return `
      <div class="recipe-card ${selected?'selected':''}" onclick="pickRecipe('${r.id}')"
           style="${selected?'border-color:var(--green);background:var(--green-light);':''}">
        <div class="rc-name">${r.name}</div>
        <div class="rc-meta">
          <span class="rc-time">⏱ ${r.time} min</span>
          <div class="rc-tags">${tags}</div>
        </div>
      </div>`;
  }).join('') : `<div style="padding:20px;color:var(--gray-500);font-size:0.88rem;">No recipes match your search.</div>`;
}

function pickRecipe(rid) {
  if (!modalContext) return;
  plan[modalContext.day][modalContext.type] = rid;
  closeModal();
  renderDaysGrid();
  rebuildGroceryList();
  showToast('Recipe added!');
}

// ── Suggest Week ──────────────────────────────────────────────────────────────
function suggestWeek() {
  const byType = {};
  MEAL_TYPES.forEach(t => byType[t] = RECIPES.filter(r => r.type === t));

  DAYS.forEach(day => {
    MEAL_TYPES.forEach(type => {
      const pool = byType[type];
      plan[day][type] = pool[Math.floor(Math.random() * pool.length)].id;
    });
  });

  renderDaysGrid();
  rebuildGroceryList();
  showToast('Week planned! ✨');
}

function clearAll() {
  DAYS.forEach(d => MEAL_TYPES.forEach(t => plan[d][t] = null));
  groceryChecked = {};
  renderDaysGrid();
  renderGroceryList();
  showToast('Cleared.');
}

// ── Servings ─────────────────────────────────────────────────────────────────
function updateServings(val) {
  servings = parseInt(val);
  document.getElementById('servings-val').textContent = val;
  rebuildGroceryList();
}

// ── Grocery List ──────────────────────────────────────────────────────────────
function rebuildGroceryList() {
  // Aggregate ingredients across all planned meals
  const agg = {}; // key: "unit|name|category" → {name, unit, category, totalAmt}
  DAYS.forEach(day => {
    MEAL_TYPES.forEach(type => {
      const rid = plan[day][type];
      if (!rid) return;
      const recipe = RECIPES.find(r => r.id === rid);
      if (!recipe) return;
      recipe.ingredients.forEach(([amt, unit, name, cat]) => {
        const k = `${unit}|${name}|${cat}`;
        if (!agg[k]) agg[k] = { name, unit, category: cat, total: 0 };
        agg[k].total += amt * servings;
      });
    });
  });

  // Group by category
  const categories = {};
  Object.entries(agg).forEach(([k, item]) => {
    if (!categories[item.category]) categories[item.category] = [];
    categories[item.category].push({ key: k, ...item });
  });

  // Sort categories
  const sortedCats = Object.keys(categories).sort((a, b) => {
    const ai = CATEGORY_ORDER.indexOf(a);
    const bi = CATEGORY_ORDER.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  const totalItems = Object.keys(agg).length;
  document.getElementById('grocery-count').textContent = totalItems;

  const body = document.getElementById('grocery-body');
  if (totalItems === 0) {
    body.innerHTML = `<div class="grocery-empty"><span class="icon">🛒</span>Add meals to generate your grocery list</div>`;
    return;
  }

  body.innerHTML = sortedCats.map(cat => {
    const items = categories[cat];
    return `
      <div class="grocery-section">
        <div class="grocery-section-header">${cat}</div>
        ${items.map(item => {
          const checked = !!groceryChecked[item.key];
          const amt = formatAmount(item.total, item.unit);
          return `
            <div class="grocery-item ${checked?'checked':''}" id="gi-${CSS.escape(item.key)}">
              <input type="checkbox" id="cb-${CSS.escape(item.key)}" ${checked?'checked':''} onchange="toggleCheck('${item.key.replace(/'/g,"\\'")}', this.checked)" />
              <label for="cb-${CSS.escape(item.key)}">${item.name}</label>
              <span class="grocery-amount">${amt}</span>
            </div>`;
        }).join('')}
      </div>`;
  }).join('');
}

function renderGroceryList() {
  rebuildGroceryList();
}

function formatAmount(total, unit) {
  if (!unit) return `× ${Math.ceil(total)}`;
  const rounded = Math.round(total * 100) / 100;
  return `${rounded % 1 === 0 ? rounded : rounded.toFixed(1)} ${unit}`;
}

function toggleCheck(key, checked) {
  groceryChecked[key] = checked;
  const row = document.getElementById('gi-' + CSS.escape(key));
  if (row) row.classList.toggle('checked', checked);
}

function uncheckAll() {
  groceryChecked = {};
  document.querySelectorAll('.grocery-item').forEach(el => el.classList.remove('checked'));
  document.querySelectorAll('.grocery-item input[type=checkbox]').forEach(cb => cb.checked = false);
}

function removeChecked() {
  const checkedKeys = Object.entries(groceryChecked).filter(([,v]) => v).map(([k]) => k);
  if (!checkedKeys.length) { showToast('Nothing checked.'); return; }
  checkedKeys.forEach(k => delete groceryChecked[k]);
  // Remove matching ingredients from the plan by zeroing out?
  // Instead: just hide them by adding to an exclusion list stored separately
  // Simpler: mark as manually removed so they stay out even after grocery rebuild
  if (!window._removedItems) window._removedItems = new Set();
  checkedKeys.forEach(k => window._removedItems.add(k));
  rebuildGroceryListWithExclusions();
  showToast(`Removed ${checkedKeys.length} item${checkedKeys.length>1?'s':''}.`);
}

function rebuildGroceryListWithExclusions() {
  // Re-aggregate with exclusions
  const agg = {};
  DAYS.forEach(day => {
    MEAL_TYPES.forEach(type => {
      const rid = plan[day][type];
      if (!rid) return;
      const recipe = RECIPES.find(r => r.id === rid);
      if (!recipe) return;
      recipe.ingredients.forEach(([amt, unit, name, cat]) => {
        const k = `${unit}|${name}|${cat}`;
        if (window._removedItems && window._removedItems.has(k)) return;
        if (!agg[k]) agg[k] = { name, unit, category: cat, total: 0 };
        agg[k].total += amt * servings;
      });
    });
  });

  const categories = {};
  Object.entries(agg).forEach(([k, item]) => {
    if (!categories[item.category]) categories[item.category] = [];
    categories[item.category].push({ key: k, ...item });
  });

  const sortedCats = Object.keys(categories).sort((a, b) => {
    const ai = CATEGORY_ORDER.indexOf(a);
    const bi = CATEGORY_ORDER.indexOf(b);
    return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
  });

  const totalItems = Object.keys(agg).length;
  document.getElementById('grocery-count').textContent = totalItems;

  const body = document.getElementById('grocery-body');
  if (totalItems === 0) {
    body.innerHTML = `<div class="grocery-empty"><span class="icon">🛒</span>Add meals to generate your grocery list</div>`;
    return;
  }

  body.innerHTML = sortedCats.map(cat => {
    const items = categories[cat];
    return `
      <div class="grocery-section">
        <div class="grocery-section-header">${cat}</div>
        ${items.map(item => {
          const checked = !!groceryChecked[item.key];
          const amt = formatAmount(item.total, item.unit);
          return `
            <div class="grocery-item ${checked?'checked':''}" id="gi-${CSS.escape(item.key)}">
              <input type="checkbox" id="cb-${CSS.escape(item.key)}" ${checked?'checked':''} onchange="toggleCheck('${item.key.replace(/'/g,"\\'")}', this.checked)" />
              <label for="cb-${CSS.escape(item.key)}">${item.name}</label>
              <span class="grocery-amount">${amt}</span>
            </div>`;
        }).join('')}
      </div>`;
  }).join('');
}

// Override rebuildGroceryList to respect exclusions
const _originalRebuild = rebuildGroceryList;
function rebuildGroceryList() {
  if (window._removedItems && window._removedItems.size > 0) {
    rebuildGroceryListWithExclusions();
  } else {
    // inline the original logic
    const agg = {};
    DAYS.forEach(day => {
      MEAL_TYPES.forEach(type => {
        const rid = plan[day][type];
        if (!rid) return;
        const recipe = RECIPES.find(r => r.id === rid);
        if (!recipe) return;
        recipe.ingredients.forEach(([amt, unit, name, cat]) => {
          const k = `${unit}|${name}|${cat}`;
          if (!agg[k]) agg[k] = { name, unit, category: cat, total: 0 };
          agg[k].total += amt * servings;
        });
      });
    });

    const categories = {};
    Object.entries(agg).forEach(([k, item]) => {
      if (!categories[item.category]) categories[item.category] = [];
      categories[item.category].push({ key: k, ...item });
    });

    const sortedCats = Object.keys(categories).sort((a, b) => {
      const ai = CATEGORY_ORDER.indexOf(a);
      const bi = CATEGORY_ORDER.indexOf(b);
      return (ai === -1 ? 999 : ai) - (bi === -1 ? 999 : bi);
    });

    const totalItems = Object.keys(agg).length;
    document.getElementById('grocery-count').textContent = totalItems;

    const body = document.getElementById('grocery-body');
    if (totalItems === 0) {
      body.innerHTML = `<div class="grocery-empty"><span class="icon">🛒</span>Add meals to generate your grocery list</div>`;
      return;
    }

    body.innerHTML = sortedCats.map(cat => {
      const items = categories[cat];
      return `
        <div class="grocery-section">
          <div class="grocery-section-header">${cat}</div>
          ${items.map(item => {
            const checked = !!groceryChecked[item.key];
            const amt = formatAmount(item.total, item.unit);
            return `
              <div class="grocery-item ${checked?'checked':''}" id="gi-${CSS.escape(item.key)}">
                <input type="checkbox" id="cb-${CSS.escape(item.key)}" ${checked?'checked':''} onchange="toggleCheck('${item.key.replace(/'/g,"\\'")}', this.checked)" />
                <label for="cb-${CSS.escape(item.key)}">${item.name}</label>
                <span class="grocery-amount">${amt}</span>
              </div>`;
          }).join('')}
        </div>`;
    }).join('');
  }
}

// ── Toast ──────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}
